spring:
  datasource:
    url: "jdbc:h2:mem:gamerin_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SEQUENCE IF NOT EXISTS report_code_seq START WITH 1001"
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
            scope:
              - profile
              - email

app:
  auth:
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key-test
      access-token-expiration-seconds: 1800
      refresh-token-expiration-seconds: 1209600
      refresh-cookie-name: refresh_token
      refresh-cookie-secure: false
      refresh-cookie-same-site: Lax
    password-reset:
      expiration-minutes: 30
  media:
    upload-dir: build/test-uploads
    video:
      optimization:
        enabled: false
        ffmpeg-path: ffmpeg
      processing:
        # 테스트는 작업 처리를 직접 호출해 검증한다. 스케줄러가 H2에서 대기열을 계속 조회하지 않게 끈다.
        worker-enabled: false
  post:
    cleanup:
      hard-delete-after: 24h
      hidden-hard-delete-after: 14d
      initial-delay-ms: 60000
      fixed-delay-ms: 3600000
  frontend:
    base-url: http://localhost:3000
    password-reset-path: /auth/reset-password
  mail:
    from-address: no-reply@gamerin.test

pubg:
  api:
    key: test-pubg-api-key

openai:
  api:
    key: test-key
  moderation:
    enabled: false
    model: omni-moderation-latest
    ffmpeg-path: ffmpeg