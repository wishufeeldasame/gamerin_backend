spring:
  jackson:
    deserialization:
      fail-on-numbers-for-enums: true  # enum 순번(2, "2")을 코드로 받지 않는다
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:500MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:530MB}

server:
  port: 8080

app:
  weekly-report:
    # 사용자 사이 수집 간격. HenrikDev 분당 한도를 나눠 쓴다.
    user-interval: ${WEEKLY_REPORT_USER_INTERVAL:30s}
    ai:
      # 모델은 기본값이 없다. 선택한 공급자의 키나 모델이 비면 규칙 기반 문장으로 대체한다.
      # factchat(학교 Mindlogic 게이트웨이) 또는 nvidia(NVIDIA Build). 둘 다 OpenAI Chat Completions 호환이다.
      provider: ${WEEKLY_REPORT_AI_PROVIDER:factchat}
      connect-timeout: ${WEEKLY_REPORT_AI_CONNECT_TIMEOUT:3s}
      read-timeout: ${WEEKLY_REPORT_AI_READ_TIMEOUT:300s}
      # OpenAI 호환 reasoning_effort(low·medium·high 등). 비우면 요청에 넣지 않는다.
      reasoning-effort: ${WEEKLY_REPORT_AI_REASONING_EFFORT:}
      factchat:
        url: ${FACTCHAT_API_URL:https://factchat-cloud.mindlogic.ai/v1/gateway/chat/completions/}
        key: ${FACTCHAT_SECRET_KEY:}
        model: ${FACTCHAT_MODEL:}
      nvidia:
        url: ${NVIDIA_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
        key: ${NVIDIA_SECRET_KEY:}
        model: ${NVIDIA_MODEL:}
  legal:
    terms-version: "1.0"
    privacy-version: "1.1"
  cors:
    allowed-origins:
      - http://localhost:3000
  media:
    upload-dir: uploads
    upload:
      max-concurrency: ${APP_MEDIA_UPLOAD_MAX_CONCURRENCY:1}
      acquire-timeout-ms: ${APP_MEDIA_UPLOAD_ACQUIRE_TIMEOUT_MS:5000}
    video:
      max-file-size-bytes: ${APP_MEDIA_VIDEO_MAX_FILE_SIZE_BYTES:524288000}
      temp-storage-reserve-bytes: ${APP_MEDIA_VIDEO_TEMP_STORAGE_RESERVE_BYTES:536870912}
      optimization:
        enabled: true
        ffmpeg-path: ffmpeg
        max-concurrency: ${APP_MEDIA_VIDEO_OPTIMIZATION_MAX_CONCURRENCY:1}
        acquire-timeout-ms: ${APP_MEDIA_VIDEO_OPTIMIZATION_ACQUIRE_TIMEOUT_MS:5000}
        timeout-ms: ${APP_MEDIA_VIDEO_OPTIMIZATION_TIMEOUT_MS:60000}
      # 게시물 영상 비동기 재인코딩(워커). 작업 입력은 job-dir(기본 java.io.tmpdir 아래)에 둔다.
      processing:
        worker-enabled: ${APP_MEDIA_VIDEO_PROCESSING_WORKER_ENABLED:true}
        preset: ${APP_MEDIA_VIDEO_PROCESSING_PRESET:veryfast}
        timeout-ms: ${APP_MEDIA_VIDEO_PROCESSING_TIMEOUT_MS:600000}
        poll-delay-ms: ${APP_MEDIA_VIDEO_PROCESSING_POLL_DELAY_MS:2000}
  post:
    cleanup:
      hard-delete-after: 24h
      hidden-hard-delete-after: 14d
      initial-delay-ms: 60000
      fixed-delay-ms: 3600000
  payment:
    recovery:
      initial-delay-ms: 60000
      fixed-delay-ms: 300000
  hashtag:
    backfill:
      enabled: ${APP_HASHTAG_BACKFILL_ENABLED:false}
      batch-size: ${APP_HASHTAG_BACKFILL_BATCH_SIZE:200}
  frontend:
    base-url: http://localhost:3000
    password-reset-path: /auth/reset-password
  mail:
    from-address: no-reply@gamerin.local
  auth:
    password-reset:
      expiration-minutes: 30
    refresh-token:
      # 회전된 refresh 토큰이 이 시간 안에 다시 오면 여러 탭의 동시 갱신으로 보고 409만 반환한다. 이후 재사용은 탈취로 보고 전체 폐기한다.
      reuse-grace-seconds: 30

pubg:
  api:
    connect-timeout: ${PUBG_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${PUBG_API_READ_TIMEOUT:10s}

riot:
  api:
    connect-timeout: ${RIOT_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${RIOT_API_READ_TIMEOUT:10s}

henrik:
  api:
    key: ${HENRIK_API_KEY:}
    base-url: ${HENRIK_API_BASE_URL:https://api.henrikdev.xyz}
    connect-timeout: ${HENRIK_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${HENRIK_API_READ_TIMEOUT:10s}

r6:
  api:
    key: ${R6DATA_API_KEY:}
    base-url: ${R6DATA_API_BASE_URL:https://api.r6data.com}
    connect-timeout: ${R6DATA_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${R6DATA_API_READ_TIMEOUT:10s}

kakaopay:
  api:
    base-url: https://open-api.kakaopay.com
    secret-key: ${KAKAOPAY_SECRET_KEY:}
    connect-timeout: 3s
    # 카카오페이 플랫폼 타임아웃(11초)보다 길게 둔다. 초과하면 결과 불명으로 처리한다.
    read-timeout: 15s
  # 허용하는 유일한 CID. 비어 있으면 결제 준비를 거부한다.
  cid: ${KAKAOPAY_CID:}
  # 결제 취소 API 기능 플래그. 사용자 화면 연결은 없다.
  cancel-enabled: ${KAKAOPAY_CANCEL_ENABLED:false}

openai:
  api:
    key: ${OPENAI_API_KEY:}
  moderation:
    enabled: true
    ffmpeg-timeout-ms: ${OPENAI_MODERATION_FFMPEG_TIMEOUT_MS:15000}
    model: omni-moderation-latest
    max-parallel-requests: ${OPENAI_MODERATION_MAX_PARALLEL_REQUESTS:4}
    connect-timeout: ${OPENAI_MODERATION_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENAI_MODERATION_READ_TIMEOUT:10s}
    ffmpeg-path: ffmpeg
