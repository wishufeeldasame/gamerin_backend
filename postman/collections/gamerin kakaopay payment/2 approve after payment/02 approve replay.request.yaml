$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/payments/kakao/approve'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}",
      "pgToken": "{{pgToken}}"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userAToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));

      pm.test('APPROVED · 결제 수단·승인 시각 기록 · 민감 필드 미노출', () => {
        const d = pm.response.json().data;
        pm.expect(d.orderId).to.eql(pm.collectionVariables.get('orderId'));
        pm.expect(d.status).to.eql('APPROVED');
        pm.expect(d.amount).to.eql(10000);
        pm.expect(['CARD', 'MONEY']).to.include(d.paymentMethodType);
        pm.expect(d.approvedAt).to.be.a('string');
        ['tid', 'aid', 'cid'].forEach(k => pm.expect(d).to.not.have.property(k));
      });
      // 새로고침 재호출: 카카오페이를 다시 호출하지 않고 현재 상태를 반환한다.
