$kind: collection
name: GamerIN KakaoPay Payment
description: |-
  #85 카카오페이 충전 결제 API 시나리오.

  1. `1 ready and errors`: 테스트 사용자 A·B를 가입시켜 토큰을 받고, 상품 목록·ready·주문 조회·approve 거부 케이스를 검증한다.
     ready 성공 요청은 카카오페이 dev를 실제로 호출하므로 백엔드에 KAKAOPAY_SECRET_KEY(dev)와 KAKAOPAY_CID=TC0ONETIME이 필요하다.
  2. 1번 실행 후 `pcUrl` 변수의 결제창에서 테스트 결제를 마치고, 복귀 URL의 pg_token을 `pgToken` 변수에 넣는다.
     pg_token은 1회용이며 저장소·로그에 남기지 않는다.
  3. `2 approve after payment`: 승인·재승인(1회 적립)·잔액·원장을 검증한다. 같은 세션에서 1번에 이어 실행해야 한다(orderId·userAToken 사용).

  결제 요청은 ready 후 15분간 유효하다. baseUrl은 로컬 백엔드(기본 http://127.0.0.1:8080)다.
variables:
  - key: baseUrl
    value: 'http://127.0.0.1:8080'
  - key: userAHandle
    value: ''
  - key: userBHandle
    value: ''
  - key: userAToken
    value: ''
  - key: userBToken
    value: ''
  - key: requestId
    value: ''
  - key: orderId
    value: ''
  - key: pcUrl
    value: ''
  - key: pgToken
    value: ''
