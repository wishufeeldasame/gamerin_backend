$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/payments/{{orderId}}'
order: 16000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userAToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('거부된 approve가 상태를 바꾸지 않음', () => pm.expect(pm.response.json().data.status).to.eql('READY'));
