$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/payments/{{orderId}}'
order: 12000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userBToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('오류 형식 { success:false, message }', () => {
        const b = pm.response.json();
        pm.expect(b.success).to.eql(false);
        pm.expect(b.message).to.be.a('string');
      });
