$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/payments/kakao/approve'
order: 15000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "orderId": "{{orderId}}"
    }
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{userAToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
